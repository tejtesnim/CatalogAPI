
name: CI/CD Pipeline - ProductCatalog API

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  checks: write

jobs:

  # JOB 1 : TESTS UNITAIRES
  unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj

      - name: Build solution
        run: dotnet build tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj --configuration Release --no-restore

      - name: Run Unit Tests
        run: >
          dotnet test tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj
          --filter "FullyQualifiedName~ProductUnitTests"
          --no-build
          --configuration Release
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=UnitResults.trx"
          --results-directory ./TestResults/UnitTests

      - name: Upload Unit Tests Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: ./TestResults/UnitTests/*.trx

      - name: Publish Unit Test Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'Report - Unit Tests'
          path: './TestResults/UnitTests/*.trx'
          reporter: 'dotnet-trx'

  # JOB 2 : TESTS D'INTEGRATION
  integration-tests:
    name: Integration Tests (SQL Server)
    runs-on: ubuntu-latest
    needs: [unit-tests]

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Password123!"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj

      - name: Build solution
        run: dotnet build tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj --configuration Release --no-restore

      - name: Run Integration Tests
        env:
          ConnectionStrings__CatalogDbConnection: "Server=localhost,1433;Database=CatalogDB_Test;User Id=sa;Password=Password123!;TrustServerCertificate=True;MultipleActiveResultSets=true"
        run: >
          dotnet test tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj
          --filter "FullyQualifiedName~ProductIntegrationTests"
          --no-build
          --configuration Release
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=IntegrationResults.trx"
          --results-directory ./TestResults/IntegrationTests

      - name: Upload Integration Tests TRX
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: ./TestResults/IntegrationTests/*.trx

      - name: Publish Integration Test Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'Report - Integration Tests'
          path: './TestResults/IntegrationTests/*.trx'
          reporter: 'dotnet-trx'
